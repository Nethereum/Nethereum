# CodeQuality configuration for the Nethereum tree.
#
# Discovered by walking up from whatever path is analysed, so this one file covers
# every package under src/.

parse:
  # Nethereum.EVM.Core is compiled TWICE from one source tree: the sync arm carries
  # EVM_SYNC and becomes the Zisk prover guest, the async arm becomes Nethereum.EVM.
  # With no symbols defined, every `#if EVM_SYNC` region parses as disabled text and
  # its methods are invisible to the analysis - the tool warns about 61 such files in
  # EVM.Core and 6 in CoreChain.
  #
  # Defining it here analyses the SYNC arm. That does NOT make the picture complete:
  # it moves the blind spot to the `#else` branches instead. The honest reading of a
  # dual-compiled package is the UNION of a run with this symbol and a run without,
  # which is why the analyser should grow a multi-configuration mode rather than this
  # file pretending one symbol set is the answer.
  preprocessorSymbols:
    - EVM_SYNC

# Class size ranks the TYPE, not the method, and it is aggregated across every file that
# declares part of a `partial` type. That aggregation is the whole point: the recommended
# remedy here is to split an oversized type into partial files first and only then into real
# classes, so a per-file measure would score the half-done remedy as a cure. EVMSimulator is
# the live case - one type, three files (EVMSimulator.cs, .SetupCallFrame.cs,
# .SetupCreateFrame.cs), 79 members, 2,164 lines.
#
# Neither threshold is an aggregate line count, for the same reason: lines are the number a
# partial split moves without changing anything real. Lines are reported as scale only.
#
# maxTypeMembers: 20. Measured over Nethereum.CoreChain + Nethereum.EVM.Core, 759 types with at
# least one member: median 4, p90 15, p95 23, p99 61, max 110. A limit of 20 sits between p90
# and p95 and fires on 46 types (6.1%) - a work queue, not a wall. Members are methods +
# properties + fields + events + constructors, counted per TYPE (a nested type is its own
# entry), because responsibility count is what a decomposition has to reduce and it is the one
# number collapsing duplication does NOT move: ChainNodeBase stayed the worst type in the tree
# (110 members) after 116 duplicated lines were removed from it.
#
# maxLongMethodsPerType: 3. Same population: p99 of "own methods over maxMethodLines" is 3, so
# >3 targets the 1% tail. It exists as a SECOND, independent trigger because a type can look
# compact and still be under-decomposed - CoreChain.Sync.HeaderFollowService has only 15
# members but 4 of its 8 methods exceed 35 lines, and member count alone never sees it.
profiles:
  default:
    maxMethodLines: 35
    maxNesting: 3
    maxParameters: 6
    maxTypeMembers: 20
    maxLongMethodsPerType: 3

  # Consensus-critical code carries a stricter bar because the cost of a defect is a
  # chain split rather than a bug. Not yet bound to a glob - binding it would change
  # the numbers under the campaign mid-flight, and the queue is generated from the
  # default profile. Declared so the intent is on record and the binding is one line.
  consensus:
    maxMethodLines: 35
    maxNesting: 3
    maxParameters: 6
    maxTypeMembers: 20
    maxLongMethodsPerType: 3

clone:
  # Eight statements is the tool's default and it already finds real duplicates here
  # (Gas/Opcodes/Costs/CallGasCosts.cs:268 and :293). Left at the default until there
  # is evidence a different figure is better, rather than tuned to flatter the tree.
  minStatements: 8
